repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # generated episode and benchmark logs: SHA-256 plan/chain hashes and image digests, no config or keys
        exclude: ^(eval/results/((episodes|bench|smoke)/|score_[^/]+\.json$)|plants/[^/]+/confirmed\.yaml$|site/data/)  # public seal and plan hashes; site/data/ is replay JSON built from bundles (no .env value in it, checked)
  - repo: local
    hooks:
      - id: pytest
        name: pytest (fast, not net)
        entry: .venv/Scripts/python.exe -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
