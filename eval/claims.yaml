# Claims ledger in machine form (docs/CLAIMS.md is the human table). eval/claims_audit.py reads this file:
# runs each claim's tests, loads its result file, renders the sentence, compares it with README.md.
# Only claims_audit.py marks a claim PASSING. One entry per batch figure; batches are never pooled.
#
# Fields: id, batch (p1 | 2 | p2 | plan | tests), engine (label printed beside every figure), sentence (exact
# README sentence; {dotted.key} or {dotted.key:format} placeholders), tests (pytest node ids, run with
# --runxfail so an xfail test counts as failing), results (one file under eval/; a * picks the newest match),
# keys (every dotted key the claim needs), require (key: value that must hold, e.g. a "0" the sentence states),
# tags_same_commit (git tags that must point at one commit), src_diff (from, to, files: exactly the src/ files
# changed between two tags; no files = identical src/).
#
# Result keys in eval/results/score_<batch>.json (eval/score.py must write these names):
#   dangerous_miss.primary.{k,n,ci_low,ci_high}      pre-registered hazard definition (EVAL.md, DECISIONS Nov 3)
#   dangerous_miss.secondary.{k,n,ci_low,ci_high}    stricter definition added Nov 3 (flow limit 0.1 %)
#   missed_faults.{k,n}
#   false_blocks.{k,n,ci_low,ci_high}                clean episodes (S0) only
#   invalid.{k,n}
#   per_scenario.<id>.{n,blocked,escalated,no_discrepancy,match}   <id> as in eval/scenarios (S7-same, S4-small ...)
#   camera.{with_camera_blocked,n}                   batch 2: with-camera track on the S8 episodes
#   baselines.gauge_rule.dangerous_miss.primary.{k,n}
#   baselines.muse_alone.dangerous_miss.primary.{k,n}
# Also needed (not in the first key list; agent B / lead to add or tell A to change):
#   ids.{n,zerostate_writes,operator_missing}        score_p1.json: sid 9100001 total, episodes with sid 9100002 = 0
#   p2_writes.{n,zerostate}                          score_p2.json: P2 server write attempts by user zerostate
#   plan_set.{cases,errors.k,errors.n,false_blocks.k,false_blocks.n}   score_2.json: plan set (PC1-PC6 flagged, PC0 blocked)

claims:
  - id: C1
    batch: p1
    engine: live checks only (Phase 1 engine)
    sentence: "ZeroState has no write code path to the plant and can reach only the PLC's Modbus port, P2's OPC UA endpoint, the model proxy and the frame service; across {ids.n} P1 episodes in batch p1 (live checks only (Phase 1 engine)) the plant's IDS logged {ids.zerostate_writes} Modbus writes from it, while the same rule caught the operator script's writes in every episode."
    # reachability is lab evidence: pytest -m net output (tests/net/) goes in PHASE_3_GATE.md
    tests: [tests/test_readonly.py, tests/test_firewall.py]
    results: eval/results/score_p1.json
    keys: [ids.n, ids.zerostate_writes, ids.operator_missing]
    require: {ids.zerostate_writes: 0, ids.operator_missing: 0}

  - id: C1.p2
    batch: p2
    engine: gas line, full engine
    sentence: "P2's server logged {p2_writes.zerostate} write attempts by ZeroState's user across {p2_writes.n} episodes in batch p2 (gas line, full engine)."
    tests: [tests/test_p2_server.py, tests/test_opcua_adapter.py]
    results: eval/results/score_p2.json
    keys: [p2_writes.n, p2_writes.zerostate]
    require: {p2_writes.zerostate: 0}

  - id: C2
    batch: p2
    engine: gas line, full engine
    # reworded Nov 4 (DECISIONS): batch p2 re-froze after batch 2, so "from one commit" no longer holds
    sentence: "The same engine ran both plants, and no plant-specific name appears in `src/` (P1 GRFICS over Modbus in batch 2; P2, our gas line over OPC UA, in batch p2). Between the batches, two rule fixes found on P2 tuning seeds changed `src/` (LIVE-VALVE v2, LIVE-ALIVE v3); every published P1 episode replays to its logged verdict under the fixed rules."
    tests: [tests/test_plant_agnostic.py, tests/test_published_replay.py]
    results: eval/results/score_p2.json
    keys: [invalid.n]  # score_p2.json exists = batch p2 ran
    src_diff:  # batch 2 ran bench-freeze-2; batch p2 ran bench-freeze-p2b (75 entries) and bench-freeze-p2c (the 5 S2 re-runs)
      - {from: bench-freeze-2, to: bench-freeze-p2b, files: [src/zerostate/checks/live/__init__.py, src/zerostate/checks/live/alive.py, src/zerostate/checks/live/valve.py]}
      - {from: bench-freeze-p2b, to: bench-freeze-p2c}

  - id: C3
    batch: plan
    engine: plan checks (batch 2 plan set, full engine)
    sentence: "On {plan_set.cases} plan cases generated by mutation, modelled on incident patterns, authored by us, it flagged {plan_set.errors.k} of {plan_set.errors.n} planted errors; it falsely blocked {plan_set.false_blocks.k} of {plan_set.false_blocks.n} correct plans (batch 2 plan set)."
    tests: [tests/test_plan_cases.py, tests/test_build.py, tests/checks/test_paths.py, tests/checks/test_liveside.py,
            tests/checks/test_boxedin.py, tests/checks/test_software.py, tests/checks/test_type.py,
            tests/checks/test_proving.py, tests/checks/test_mapping.py]
    results: eval/results/score_2.json
    keys: [plan_set.cases, plan_set.errors.k, plan_set.errors.n, plan_set.false_blocks.k, plan_set.false_blocks.n]

  - id: C4
    batch: tests
    engine: offline test suite
    sentence: "A pressure reading is used as evidence only after it has tracked the depressurisation and agreed with an independent physics estimate."
    tests: [tests/checks/test_alive.py, tests/checks/test_relation.py]

  - id: C5.p1
    batch: p1
    engine: live checks only (Phase 1 engine)
    sentence: "Across {dangerous_miss.primary.n} pre-registered live episodes in batch p1 (live checks only (Phase 1 engine)) it had {dangerous_miss.primary.k} dangerous misses (95% CI {dangerous_miss.primary.ci_low}–{dangerous_miss.primary.ci_high}) under the pre-registered hazard definition and {dangerous_miss.secondary.k} under the stricter one added Nov 3, vs {baselines.gauge_rule.dangerous_miss.primary.k} for the gauge rule and {baselines.muse_alone.dangerous_miss.primary.k} for Muse Spark alone; known blind spots are listed."
    tests: [tests/test_published_replay.py]
    results: eval/results/score_p1.json
    keys: [dangerous_miss.primary.n, dangerous_miss.primary.k, dangerous_miss.primary.ci_low, dangerous_miss.primary.ci_high,
           dangerous_miss.secondary.k, baselines.gauge_rule.dangerous_miss.primary.k, baselines.muse_alone.dangerous_miss.primary.k]

  - id: C5.p2
    batch: p2
    engine: gas line, full engine
    sentence: "Across {dangerous_miss.primary.n} pre-registered live episodes in batch p2 (gas line, full engine) it had {dangerous_miss.primary.k} dangerous misses (95% CI {dangerous_miss.primary.ci_low}–{dangerous_miss.primary.ci_high}) under the pre-registered hazard definition and {dangerous_miss.secondary.k} under the stricter one added Nov 3, vs {baselines.gauge_rule.dangerous_miss.primary.k} for the gauge rule and {baselines.muse_alone.dangerous_miss.primary.k} for Muse Spark alone; known blind spots are listed."
    tests: []
    results: eval/results/score_p2.json
    keys: [dangerous_miss.primary.n, dangerous_miss.primary.k, dangerous_miss.primary.ci_low, dangerous_miss.primary.ci_high,
           dangerous_miss.secondary.k, baselines.gauge_rule.dangerous_miss.primary.k, baselines.muse_alone.dangerous_miss.primary.k]

  - id: C6.p1
    batch: p1
    engine: live checks only (Phase 1 engine)
    sentence: "In {false_blocks.n} clean runs in batch p1 (live checks only (Phase 1 engine)) it falsely blocked or escalated {false_blocks.k} (95% CI upper bound {false_blocks.ci_high_pct}%)."
    tests: []
    results: eval/results/score_p1.json
    keys: [false_blocks.n, false_blocks.k, false_blocks.ci_high_pct]

  - id: C6.2
    batch: "2"
    engine: full engine (live + process + camera)
    sentence: "In {false_blocks.n} clean runs in batch 2 (full engine (live + process + camera)) it falsely blocked or escalated {false_blocks.k} (95% CI upper bound {false_blocks.ci_high_pct}%)."
    tests: []
    results: eval/results/score_2.json
    keys: [false_blocks.n, false_blocks.k, false_blocks.ci_high_pct]

  - id: C6.p2
    batch: p2
    engine: gas line, full engine
    sentence: "In {false_blocks.n} clean runs in batch p2 (gas line, full engine) it falsely blocked or escalated {false_blocks.k} (95% CI upper bound {false_blocks.ci_high_pct}%)."
    tests: []
    results: eval/results/score_p2.json
    keys: [false_blocks.n, false_blocks.k, false_blocks.ci_high_pct]

  - id: C7
    batch: tests
    engine: idealised camera, sealed frames set (no benchmark batch)
    sentence: "Reading accuracy, idealised camera, fault-free frames: SAM 3.1 + Muse Spark read {all.exact_1pct} of {all.n} valve displays within 1 % on a sealed set of frames (the camera renders the simulator's true state). This measures reading, not fault detection."
    tests: [tests/test_camera.py]
    results: eval/results/read_2*.json
    keys: [all.exact_1pct, all.n]

  - id: C8.p1
    batch: p1
    engine: live checks only (Phase 1 engine)
    sentence: "In the patched simulator it blocked {per_scenario.S8.blocked} of {per_scenario.S8.n} episodes where valve position feedback lied, using physics relations (batch p1: live checks only (Phase 1 engine))."
    tests: [tests/checks/test_valve.py, tests/checks/test_relation.py]
    results: eval/results/score_p1.json
    keys: [per_scenario.S8.blocked, per_scenario.S8.n]

  - id: C8.2
    batch: "2"
    engine: full engine (live + process + camera)
    sentence: "In batch 2 (full engine (live + process + camera)), on {per_scenario.S8.n} episodes where valve position feedback lied, the data-only track blocked {per_scenario.S8.blocked}, and the with-camera track blocked {camera.by_scenario.S8.with_camera_blocked} of {camera.by_scenario.S8.n} (idealised camera, renders the simulator's true state)."
    tests: [tests/test_camera.py]
    results: eval/results/score_2.json
    keys: [per_scenario.S8.n, per_scenario.S8.blocked, camera.by_scenario.S8.with_camera_blocked, camera.by_scenario.S8.n]

  - id: C9
    batch: p1
    engine: live checks only (Phase 1 engine)
    sentence: "In tests and {per_scenario.S12.n} S12 episodes, stale or frozen data never produced a pass (batch p1: live checks only (Phase 1 engine); freeze detection depends on transmitter noise we add to the simulators)."
    tests: [tests/test_freshness.py, tests/checks/test_quality.py, tests/test_gate.py]
    results: eval/results/score_p1.json
    keys: [per_scenario.S12.n, per_scenario.S12.no_discrepancy]
    require: {per_scenario.S12.no_discrepancy: 0}

  - id: C10
    batch: tests
    engine: offline test suite
    sentence: "No model output can produce a pass or remove a block; only a signature entered in the sign dialog or `zs sign` closes a session; names are not authenticated."
    tests: [tests/test_gate.py, tests/test_firewall.py, tests/test_session.py, tests/test_camera.py, tests/test_api_contract.py]

  - id: C11
    batch: tests
    engine: offline test suite
    sentence: "Every verdict is in a hash-chained log and replays to the same verdict."
    tests: [tests/test_audit_chain.py, tests/test_replay.py, tests/test_published_replay.py]

  - id: C12
    batch: tests
    engine: P2 model, implementation check (same equations, not realism)
    sentence: "P2's simulator matches the analytic blowdown solution within {max_error_pct}% (implementation check)."
    tests: [tests/test_p2_validation.py, tests/test_p2_model.py]
    results: eval/results/p2_validation_*.json
    keys: [max_error_pct, pass]
    require: {pass: true}

  - id: C13
    batch: "2"
    engine: full engine (live + process + camera)
    sentence: "Process rules: out-of-order steps, the same person installing and verifying, and temporary de-isolation were caught in {per_scenario.S7.blocked}/{per_scenario.S7.n}, {per_scenario.S7-same.blocked}/{per_scenario.S7-same.n} and {per_scenario.S13.blocked}/{per_scenario.S13.n} episodes in that order (batch 2: full engine (live + process + camera)); independence means a different *entered* name."
    tests: [tests/checks/test_sequence.py, tests/checks/test_independence.py, tests/checks/test_reset.py]
    results: eval/results/score_2.json
    keys: [per_scenario.S7.blocked, per_scenario.S7.n, per_scenario.S7-same.blocked, per_scenario.S7-same.n,
           per_scenario.S13.blocked, per_scenario.S13.n]

  - id: C14
    batch: tests
    engine: importer, n = 12 cases authored by us (no benchmark batch)
    sentence: "Isolation lists import three ways (CSV export with no model; typed text and sheet photo/PDF structured by Muse Spark) with field precision/recall {routes.csv.precision}/{routes.csv.recall} (CSV), {routes.text.precision}/{routes.text.recall} (typed text) and {routes.image.precision}/{routes.image.recall} (photo/PDF) on n = 12 cases authored by us, and 0 invented points; nothing runs until a person confirms it."
    tests: [tests/test_importer_gate.py]
    results: eval/results/importer_2*.json
    keys: [routes.csv.precision, routes.csv.recall, routes.text.precision, routes.text.recall,
           routes.image.precision, routes.image.recall, routes.csv.invented, routes.text.invented, routes.image.invented]
    require: {routes.csv.invented: 0, routes.text.invented: 0, routes.image.invented: 0}
