[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerostate"
version = "0.1.0"
description = "Independent, read-only second check on energy isolation"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "pymodbus>=3.6,<3.10",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit", "detect-secrets"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "net: runs inside the zerostate container against the live lab",
    "live: runs on the host against the running lab (docker exec, localhost:80)",
]
addopts = "-m 'not net and not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
