# Only zs-internal clients; only CONNECT to port 443; only hosts matching the filter.
Port 8888
Listen 0.0.0.0
Timeout 300
LogLevel Info
MaxClients 20
Allow 172.30.0.0/24
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
FilterCaseSensitive Off
DisableViaHeader Yes
