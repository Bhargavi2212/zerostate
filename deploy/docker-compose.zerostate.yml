# Override for Fortiphyd's compose file. Run from D:\grfics:
#   docker compose -f docker-compose.yml -f zerostate\deploy\docker-compose.zerostate.yml up -d --build zerostate
services:
  # GRFICS simulator replaced by the derived, patched image (plants/p1_grfics/patch). Fortiphyd's file is untouched.
  simulation:
    image: zerostate/grfics-simulation:p1-1
    build: !reset null
    pull_policy: never
    environment:
      ZS_TIME_SCALE: ${ZS_TIME_SCALE:-1}
      ZS_NOISE: ${ZS_NOISE:-1}

  zerostate-net:
    build: {context: ./zerostate, dockerfile: deploy/Dockerfile.net}
    image: zerostate-net:local
    container_name: zerostate-net
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    networks:
      c-dmz-net:
        ipv4_address: 192.168.90.60
      zs-internal:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD-SHELL", "iptables -S OUTPUT | grep -qx -- '-P OUTPUT DROP' && iptables -C OUTPUT -p tcp -d 192.168.95.2 --dport 502 -j ACCEPT && iptables -C OUTPUT -p tcp -d 172.30.0.2 --dport 8888 -j ACCEPT"]
      interval: 5s
      retries: 3
      start_period: 5s

  zerostate:
    build: {context: ./zerostate, dockerfile: deploy/Dockerfile}
    image: zerostate:local
    container_name: zerostate
    # No networks of its own: it lives in zerostate-net's namespace and cannot change it.
    network_mode: "service:zerostate-net"
    cap_drop: [ALL]
    depends_on:
      zerostate-net: {condition: service_healthy}
    # MODEL_API_KEY comes from zerostate/.env (gitignored); compose runs from D:\grfics and would not read it otherwise.
    env_file:
      - path: ./zerostate/.env
        required: false
    environment:
      ZS_BUDGET_USD: ${ZS_BUDGET_USD:-75}
    volumes:
      - zs-data:/data

  # The only route to the Meta API: CONNECT api.meta.ai:443, nothing else. Its own uplink has internet;
  # zs-internal has none.
  zs-proxy:
    build: {context: ./zerostate, dockerfile: deploy/proxy/Dockerfile}
    image: zs-proxy:local
    container_name: zs-proxy
    networks:
      zs-internal:
        ipv4_address: 172.30.0.2
      zs-uplink: {}

  # Eval tooling, not the product: performs isolation steps through the PLC's manual mode.
  zs-operator:
    build: {context: ./zerostate, dockerfile: plants/p1_grfics/Dockerfile.operator}
    image: zs-operator:local
    container_name: zs-operator
    cap_add: [NET_ADMIN]
    networks:
      c-dmz-net:
        ipv4_address: 192.168.90.70

networks:
  zs-internal:
    internal: true  # no internet, no host ports: ZeroState <-> proxy and frame service only
    ipam:
      config:
        - subnet: 172.30.0.0/24
  zs-uplink: {}  # the proxy's way out

volumes:
  zs-data:
