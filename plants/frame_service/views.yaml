# Fixed camera views of the simulator's 3D page (zs-frames). GET /frame?view=<name> accepts only these names.
# Measured live Nov 3: the Unity WebGL scene renders in headless Chromium, and the page's default camera at
# 1920x1080 shows all four valve displays (f1, f2, purge, product) legibly. The page's Fullscreen button
# reloads the scene, so it is not used.
#   actions: [{press: <key>, hold_ms: n}, {click: [x, y]}, {drag: [[x1, y1], [x2, y2]]}, {wait_ms: n}]
default:
  url: http://simulation/
  viewport: [1920, 1080]
  load_wait_s: 20
  actions: []
