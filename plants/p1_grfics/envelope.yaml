# P1 GRFICS reactor maintenance plan (minimal Phase 0 stub).
plant: p1_grfics
work:
  equipment: reactor
  task: internal inspection
  permit_ids: []
sources:
  - {tag: feed1, type: process_gas}
  - {tag: feed2, type: process_gas}
points:
  - {tag: f1_valve_pos, device: control_valve, isolation_type: non_proved, normal_state: open, required_state: closed, apply_seq: 1, remove_seq: 4}
  - {tag: f2_valve_pos, device: control_valve, isolation_type: non_proved, normal_state: open, required_state: closed, apply_seq: 2, remove_seq: 3}
  - {tag: product_valve_pos, device: control_valve, isolation_type: non_proved, normal_state: open, required_state: closed, apply_seq: 3, remove_seq: 2}
proving:
  - {tag: purge_valve_pos, kind: vent, proves: [f1_valve_pos, f2_valve_pos, product_valve_pos], discharges_to: purge}
segments:
  - {id: reactor, members: [reactor], bounded_by: [f1_valve_pos, f2_valve_pos, product_valve_pos, purge_valve_pos], vents: [purge_valve_pos]}
witnesses:
  - {segment: reactor, signal_ref: pressure, role: pressure, side: work}
  - {segment: reactor, signal_ref: purge_flow, role: vent_flow, side: work}
  - {segment: reactor, signal_ref: product_flow, role: line_flow, side: work}
relations:
  - type: valve_sqrt_law
    signals: [purge_flow, purge_valve_pos, pressure]
    params: {k: 0.352, p_floor: 100}
  - type: valve_sqrt_law
    signals: [product_flow, product_valve_pos, pressure]
    params: {k: 0.0417, p_floor: 100}
assumptions:
  - {text: positive isolation upstream assumed, scope: out_of_scope}
hold_test: {hold_process_s: 90, window_process_s: 10, max_rise: 10}
