# P1 GRFICS: reactor vapour-side work, isolated with the plant's control valves through the PLC's
# manual mode, vented through purge, then held. Its plan check (Phase 2) is expected to BLOCK:
# control-valve-only, non-proved isolation. Live episodes run it under the declared assumption below.
plant: p1_grfics
work:
  equipment: reactor
  task: vapour-side internal inspection
  permit_ids: []
sources:
  - {tag: feed1, type: process_gas}
  - {tag: feed2, type: process_gas}
  - {tag: product_line, type: process_liquid}
points:
  - {tag: f1, device: control_valve, isolation_type: non_proved, normal_state: open, required_state: closed, apply_seq: 1, remove_seq: 3}
  - {tag: f2, device: control_valve, isolation_type: non_proved, normal_state: open, required_state: closed, apply_seq: 2, remove_seq: 2}
  - {tag: product, device: control_valve, isolation_type: non_proved, normal_state: open, required_state: closed, apply_seq: 3, remove_seq: 1}
proving:
  - {tag: purge, kind: vent, proves: [f1, f2, product], discharges_to: purge_header}
segments:
  - {id: reactor, members: [reactor], bounded_by: [f1, f2, product, purge], vents: [purge]}
witnesses:
  - {segment: reactor, signal_ref: pressure, role: pressure, side: work}
  - {segment: reactor, signal_ref: manual_mode, role: mode, side: work}
  - {segment: reactor, signal_ref: f1_valve_pos, role: feedback, side: work, point: f1}
  - {segment: reactor, signal_ref: f1_cmd, role: command, side: work, point: f1}
  - {segment: reactor, signal_ref: f1_flow, role: flow, side: work, point: f1}
  - {segment: reactor, signal_ref: f2_valve_pos, role: feedback, side: work, point: f2}
  - {segment: reactor, signal_ref: f2_cmd, role: command, side: work, point: f2}
  - {segment: reactor, signal_ref: f2_flow, role: flow, side: work, point: f2}
  - {segment: reactor, signal_ref: purge_valve_pos, role: feedback, side: work, point: purge}
  - {segment: reactor, signal_ref: purge_cmd, role: command, side: work, point: purge}
  - {segment: reactor, signal_ref: purge_flow, role: flow, side: work, point: purge}
  - {segment: reactor, signal_ref: product_valve_pos, role: feedback, side: work, point: product}
  - {segment: reactor, signal_ref: product_cmd, role: command, side: work, point: product}
  - {segment: reactor, signal_ref: product_flow, role: flow, side: work, point: product}
relations:
  - type: valve_sqrt_law
    signals: [purge_flow, purge_valve_pos, pressure]
    params: {k: 0.352, p_floor: 100}
assumptions:
  - {text: positive isolation upstream assumed, scope: out_of_scope}
vent_target_kpa_abs: 102
p_depressurised_kpa_abs: 105
hold_test: {hold_process_s: 600, window_process_s: 60, max_rise_kpa: 1.0}  # from clean-hold data (DECISIONS Nov 1)
steps:
  - {k: 1, kind: mode, target: manual_mode, required_state: 1, checks: [LIVE-QUALITY, LIVE-VALVE], settle_process_s: 10}
  - {k: 2, kind: isolate, target: f1, required_state: 0, checks: [LIVE-QUALITY, LIVE-VALVE], settle_process_s: 60}
  - {k: 3, kind: isolate, target: f2, required_state: 0, checks: [LIVE-QUALITY, LIVE-VALVE], settle_process_s: 60}
  - {k: 4, kind: isolate, target: product, required_state: 0, checks: [LIVE-QUALITY, LIVE-VALVE], settle_process_s: 60}
  # purge is also a process outlet: close it with the other lines, then vent through it from full pressure
  - {k: 5, kind: isolate, target: purge, required_state: 0, checks: [LIVE-QUALITY, LIVE-VALVE], settle_process_s: 60}
  - {k: 6, kind: vent_open, target: purge, required_state: 100, checks: [LIVE-QUALITY, LIVE-ALIVE, LIVE-RELATION, LIVE-VALVE], settle_process_s: 60}
  - {k: 7, kind: vent_close, target: purge, required_state: 0, checks: [LIVE-QUALITY, LIVE-VALVE], settle_process_s: 60}
  - {k: 8, kind: hold, checks: [LIVE-QUALITY, LIVE-HOLD, LIVE-VALVE]}
  - {k: 9, kind: final}
