# P1 plant thresholds: overrides of src/zerostate/thresholds/default.yaml (existing keys only).
# Copied into the zerostate image at /app/config/p1_grfics/. Phase 1 tuning (tuning seeds only)
# bumps the version and records a one-line reason in docs/DECISIONS.md.
version: "p1-3"  # p1-3: default v6 (min_settle_wall_s 3)
# Set from the clean-hold distribution on tuning seeds: holds fall 3.5-5.4 kPa over 600 process-s,
# window-mean difference noise about +-0.5 kPa. 5 kPa was provisional and hid leaks up to ~0.35 %.
hold_max_rise_kpa: 1.0
