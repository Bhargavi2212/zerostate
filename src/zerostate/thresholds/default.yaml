# Generic live-check thresholds. Plant files (plants/<p>/thresholds.yaml) may override existing keys only.
# Every name ends in its unit: _process_s, _wall_s, _kpa, _pct, _per_process_s or _samples.
version: "5"  # v5: camera_* keys added (LIVE-CAMERA, with-camera track only); v4: final_mean_process_s added (LIVE-HOLD v3)
# LIVE-QUALITY (QARTOD gross range / rate of change / spike, own code; rate + spike only on pressure and level)
pressure_min_kpa: 50
pressure_max_kpa: 3200
max_rate_kpa_per_process_s: 50
max_rate_level_pct_per_process_s: 2
rate_window_process_s: 20  # v2: rate baseline; a late, stale poll is not an impossible change
spike_kpa: 30
spike_level_pct: 5
# LIVE-VALVE
valve_tol_pct: 1
flow_cutoff_pct: 1
valve_check_process_s: 10
# LIVE-HOLD (the stricter of this and the plan's hold_test.max_rise_kpa applies)
hold_max_rise_kpa: 5
final_mean_process_s: 30  # v4: residual-pressure plans: depressurised = mean of the final vent's last 30 process-s
# LIVE-ALIVE
vent_check_process_s: 120
alive_purge_open_pct: 50
alive_min_fall_pct: 10
# LIVE-RELATION (CUSUM k and h provisional)
relation_min_open_pct: 5
relation_min_kpa: 150
relation_tol_pct: 10
relation_n_consec_samples: 4
cusum_k_pct: 2
cusum_h_pct: 30
# LIVE-CAMERA (with-camera track only; never read by the data-only rules)
camera_lag_max_wall_s: 5  # start value: the 3D page polls every 3 s; to be measured against truth sidecars
camera_agree_pct: 5  # a reading agrees with the feedback within +-5 % of valve travel
camera_freeze_same_pct: 5  # crop average-hash bits that may differ and still count as an unchanged display
# session / monitor
monitor_period_wall_s: 2
monitor_unknown_grace_wall_s: 10
warm_in_timeout_wall_s: 30
